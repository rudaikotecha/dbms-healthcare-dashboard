{% extends 'base.html' %}{% block title %}{{ 'Edit' if patient else 'Add' }} patient{% endblock %}{% block content %}<a class="back-link" href="{{ url_for('patients.index') }}">← Patients</a><div class="page-heading"><div><p class="eyebrow">PATIENT RECORD</p><h1>{{ 'Edit patient' if patient else 'Add patient' }}</h1><p class="muted">Enter the patient's basic details and contact entries.</p></div></div><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>First name<input name="f_name" required value="{{ request.form.get('f_name',patient.f_name if patient else '') }}"></label><label>Last name<input name="l_name" required value="{{ request.form.get('l_name',patient.l_name if patient else '') }}"></label><label>Gender<select name="gender" required>{% for g in ['Female','Male','Other','Prefer not to say'] %}<option {% if request.form.get('gender',patient.gender if patient else '')==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></label><label>Date of birth<input type="date" name="dob" required value="{{ request.form.get('dob',patient.dob if patient else '') }}" max="{{ today }}"></label><label class="wide">Contact entries <small>(one per line)</small><textarea name="contacts" rows="3" placeholder="Email or phone">{{ request.form.get('contacts',contacts) }}</textarea></label></div><div class="form-actions"><a class="button secondary" href="{{ url_for('patients.index') }}">Cancel</a><button class="button primary">{{ 'Save changes' if patient else 'Add patient' }}</button></div></form>{% endblock %}
