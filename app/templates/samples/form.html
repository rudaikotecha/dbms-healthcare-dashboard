{% extends 'base.html' %}{% block title %}{{ 'Edit' if sample else 'Register' }} sample{% endblock %}{% block content %}<a class="back-link" href="{{ url_for('samples.index') }}">← Samples</a><div class="page-heading"><div><p class="eyebrow">LABORATORY</p><h1>{{ 'Edit sample' if sample else 'Register sample' }}</h1><p class="muted">Associate a sample with an existing patient.</p></div></div><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Patient<select name="p_id" required><option value="">Select patient</option>{% for p in patients %}<option value="{{ p.patient_id }}" {% if request.form.get('p_id',sample.p_id if sample else '')|string==p.patient_id|string %}selected{% endif %}>{{ p.f_name }} {{ p.l_name }} · #{{ p.patient_id }}</option>{% endfor %}</select></label><label>Reaction status<input name="reaction_status" required value="{{ request.form.get('reaction_status',sample.reaction_status if sample else '') }}"></label><label>Collection time<input type="datetime-local" name="collection_time" required value="{{ request.form.get('collection_time',sample.collection_time if sample else '') }}"></label></div><div class="form-actions"><a class="button secondary" href="{{ url_for('samples.index') }}">Cancel</a><button class="button primary">Save sample</button></div></form>{% endblock %}
