{% extends 'base.html' %}{% block title %}{{ 'Edit' if doctor else 'Add' }} doctor{% endblock %}{% block content %}<a class="back-link" href="{{ url_for('doctors.index') }}">← Doctors</a><div class="page-heading"><div><p class="eyebrow">CARE TEAM</p><h1>{{ 'Edit doctor' if doctor else 'Add doctor' }}</h1><p class="muted">Link the doctor to an existing patient record.</p></div></div><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Name<input name="name" required value="{{ request.form.get('name',doctor.name if doctor else '') }}"></label><label>Department<input name="department" required value="{{ request.form.get('department',doctor.department if doctor else '') }}"></label><label>Linked patient<select name="p_id" required><option value="">Select patient</option>{% for p in patients %}<option value="{{ p.patient_id }}" {% if request.form.get('p_id',doctor.p_id if doctor else '')|string==p.patient_id|string %}selected{% endif %}>{{ p.f_name }} {{ p.l_name }} · #{{ p.patient_id }}</option>{% endfor %}</select></label><label>Doctor relation<select name="kind"><option {% if request.form.get('kind',doctor.kind if doctor else '')=='Clinician' %}selected{% endif %}>Clinician</option><option {% if request.form.get('kind',doctor.kind if doctor else '')=='Consultant' %}selected{% endif %}>Consultant</option></select></label><label class="wide">Designation<input name="designation" required value="{{ request.form.get('designation',doctor.designation if doctor else '') }}"></label></div><div class="form-actions"><a class="button secondary" href="{{ url_for('doctors.index') }}">Cancel</a><button class="button primary">Save doctor</button></div></form>{% endblock %}
