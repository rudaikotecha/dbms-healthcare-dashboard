{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-brand"><span class="brand-mark">+</span></div>
  <p class="eyebrow">CAREDESK · DBMS LAB</p>
  <h1>Welcome back</h1>
  <p class="muted">Sign in with your doctor account.</p>
  <form method="post" class="panel form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button primary full">Sign in</button>
  </form>
  <p class="tiny muted">New doctor? <a class="text-link" href="{{ url_for('auth.register') }}">Create an account</a></p>
  <p class="tiny muted">Educational prototype · Use fictional records</p>
</div>
{% endblock %}
