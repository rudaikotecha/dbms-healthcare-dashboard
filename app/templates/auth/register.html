{% extends 'base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-brand"><span class="brand-mark">+</span></div>
  <p class="eyebrow">CAREDESK · DOCTOR REGISTRATION</p>
  <h1>Create your account</h1>
  <p class="muted">Choose a username and password to get started.</p>
  <form method="post" class="panel form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username<input name="username" autocomplete="username" minlength="3" maxlength="40" required></label>
    <label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
    <label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label>
    <button class="button primary full">Create doctor account</button>
  </form>
  <p class="tiny muted">Already registered? <a class="text-link" href="{{ url_for('auth.login') }}">Sign in</a></p>
</div>
{% endblock %}
